[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conforflux"
version = "0.2.0"
description = "Inference-time particle guidance on the trunk embeddings of Boltz-2, Protenix and OpenFold3 for conformational diversity."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Shosuke Suzuki" },
]
dependencies = [
    "torch>=2.5,<3.0",
    "numpy>=1.26",
    "click>=8.1,<9",
    "gemmi",
    "scipy",
]

[project.urls]
Repository = "https://github.com/suzuki-2001/conforflux"

[tool.setuptools.packages.find]
where = ["."]
include = ["conforflux*"]

[tool.ruff]
line-length = 100
extend-exclude = ["boltz", "protenix", "openfold3"]
